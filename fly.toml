# Graphion on Fly.io, served publicly over HTTPS.
#
# The app is reachable at https://<app>.fly.dev. Everything behind /login is
# gated by Flask-Login, and /login itself is rate limited per address and per
# account (see the login throttling block in app.py). Assume the hostname will
# be found and probed by bots; that is what the throttle is for.

app = "graphion"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  GRAPHION_CONTENT_DIR = "/data/content"
  GRAPHION_DATA_DIR = "/data/data"
  # Served over HTTPS, so the session cookie must carry the Secure flag.
  GRAPHION_SECURE_COOKIES = "1"

[http_service]
  internal_port = 8080
  force_https = true
  # A volume binds this app to one machine, so there is nothing to scale and
  # nothing to gain from stopping it; cold starts would only slow renders.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# One volume, therefore one machine. That is correct for a single-editor app,
# but it makes the volume a single point of failure for irreplaceable journal
# source. Configure GRAPHION_BACKUP_REMOTE; see docs/deployment.md.
[mounts]
  source = "graphion_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
